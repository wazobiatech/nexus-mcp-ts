name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  tags:
    - 'v*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Download contract vectors
        run: |
          curl -L -o vectors.json \
            https://raw.githubusercontent.com/wazobiatech/nexus-mcp-contract/v1.0.0/vectors.json

      - name: Run contract vector tests
        run: npx jest tests/contract.vectors.spec.ts --verbose

      - name: Run unit tests
        run: npm run test:ci

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          scope: '@wazobiatech'
      - run: npm ci
      - name: Assert tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ github.ref_name }}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "❌ Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "✅ Tag $TAG matches package.json version"
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WAZOBIA_NPM_TOKEN }}
